name: Btime Release
on:
  workflow_run:
    workflows: ["Build"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Build workflow run ID to download artifacts from"
        required: true
      tag_name:
        description: "Release tag (e.g. v0.22.3-btime)"
        required: true

permissions:
  contents: write

jobs:
  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    # Auto: binaries are built even when npm audit etc. fail; skip only cancelled runs.
    # Manual: always run.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion != 'cancelled' &&
        contains(github.event.workflow_run.head_branch, '-btime') &&
        github.repository != 'kopia/kopia'
      )
    steps:
      - name: Resolve run ID and tag
        id: ctx
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "run_id=${{ inputs.run_id }}" >> "$GITHUB_OUTPUT"
            echo "tag_name=${{ inputs.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "run_id=${{ github.event.workflow_run.id }}" >> "$GITHUB_OUTPUT"
            echo "tag_name=${{ github.event.workflow_run.head_branch }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download artifacts from Build run
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.ctx.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: kopia-*
          merge-multiple: true
          path: dist

      - name: List artifacts
        run: ls -lR dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ctx.outputs.tag_name }}
          name: ${{ steps.ctx.outputs.tag_name }}
          body: |
            Kopia btime fork — birth time (file creation time) preservation.

            Based on upstream kopia ${{ steps.ctx.outputs.tag_name }}.

            **Enable birth time preservation:**
            ```
            kopia policy set --preserve-birth-time=true <path>
            ```
            Default is off — fully compatible with standard kopia repositories.
          files: |
            dist/*.tar.gz
            dist/*.zip
          fail_on_unmatched_files: false
