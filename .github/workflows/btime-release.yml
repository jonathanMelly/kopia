name: Btime Release
on:
  push:
    tags:
      - "v*-btime"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v0.22.3-btime)"
        required: true

permissions:
  contents: write

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run btime-related tests
        run: go test ./snapshot/upload/... ./snapshot/restore/... ./snapshot/policy/... ./fs/...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Resolve tag
        id: ctx
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag_name=${{ inputs.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag_name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          EXT=""
          [[ "${{ matrix.goos }}" == "windows" ]] && EXT=".exe"
          go build \
            -ldflags="-s -w -X github.com/kopia/kopia/repo.BuildVersion=${{ steps.ctx.outputs.tag_name }}" \
            -o "kopia-${{ matrix.goos }}-${{ matrix.goarch }}${EXT}" .

      - name: Package
        run: |
          EXT=""
          [[ "${{ matrix.goos }}" == "windows" ]] && EXT=".exe"
          NAME="kopia-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [[ "${{ matrix.goos }}" == "windows" ]]; then
            zip "${NAME}.zip" "${NAME}${EXT}"
          else
            tar czf "${NAME}.tar.gz" "${NAME}${EXT}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: kopia-${{ matrix.goos }}-${{ matrix.goarch }}
          path: "kopia-${{ matrix.goos }}-${{ matrix.goarch }}.*"

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Resolve tag
        id: ctx
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag_name=${{ inputs.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag_name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi


      - uses: actions/download-artifact@v4
        with:
          pattern: kopia-*
          merge-multiple: true
          path: dist

      - name: List artifacts
        run: ls -lR dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ctx.outputs.tag_name }}
          name: ${{ steps.ctx.outputs.tag_name }}
          body: |
            Kopia btime fork — birth time (file creation time) preservation.

            Based on upstream kopia ${{ steps.ctx.outputs.tag_name }}.

            **Enable birth time preservation:**
            ```
            kopia policy set --preserve-birth-time=true <path>
            ```
            Default is off — fully compatible with standard kopia repositories.

            **Verify the feature is present:**
            ```
            kopia policy set --help | grep birth
            # expected: --preserve-birth-time=...
            ```
            `kopia --version` will report `${{ steps.ctx.outputs.tag_name }}`.

            **KopiaUI users:** download the binary for your platform, then in KopiaUI go to
            _File → Advanced → Override Kopia executable_ and point it to this binary.
            Use the CLI once to set the policy, then KopiaUI takes over as usual.

            > Binaries are unsigned (no macOS notarization / Windows SmartScreen).
            > macOS: right-click → Open on first launch. Windows: More info → Run anyway.
          files: |
            dist/*.tar.gz
            dist/*.zip
          fail_on_unmatched_files: false
